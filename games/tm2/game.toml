# Autofilled by tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "Twisted Metal 2"
id = "SCUS-94306"
players = 2
exe = "disc/SCUS_943.06"
# No default disc: the player chooses their own image in the launcher, and
# tools/generate.sh is given its path.
load_address = "0x800CDC54"
entry_pc = "0x8013878C"
text_size = "0x000B3800"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Twisted Metal 2 (Track 1).bin"
cue_name = "Twisted Metal 2.cue"
boot_exe = "SCUS_943.06"
known_sizes = [418187952]
known_md5 = [
  "21599a9f5d4853461427893774023afa",
]
known_sha1 = [
  "d5dd081d860ce031a5d9601924c7d0f6afb33814",
]
known_crc32 = [
  "c8f01e9d",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Instructions the tm2.framerate plugin hooks (mods/src/tm2_framerate.c): the
# per-frame steps to speed and steering, the turn rate, re-centring, the slide
# term and the smoothing helpers. Inert unless the mod is on. Changing this list needs a regenerate (tools/generate.sh).
mod_instruction_sites = [
    "0x800DE19C",
    "0x800DE184",
    "0x800DE278",
    "0x800DE2A4",
    "0x800DDF74",
    "0x800DDFBC",
    "0x800E0578",
    "0x800E05A4",
    "0x800DD6D0",
    "0x800DD708",
    "0x80102DE8",
    "0x800DD878",
    "0x800DD840",
    "0x800DD7E0",
    "0x800DD7B0",
    "0x800E03AC",
    "0x801037A8",
    "0x80103820",
    "0x80103840",
    "0x80103874",
]
# Functions the plugin may skip (a counter that ticks per frame).
mod_function_entry_funcs = ["0x800FBC44"]

[runtime]
# The frame rate patches are a hidden mod feature that the launcher's FPS Mode
# setting switches; keep it out of the Mods list.
hide_hidden_mod_features = true
window_title = "Twisted Metal 2 Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
# Settings are shared by all four games; Smooth Motion only holds up on
# Twisted Metal 4, so this game ignores it.
frame_generation_allowed = false

# Widescreen is the launcher's Settings -> Aspect ratio choice (4:3, 16:9 or
# 21:9); these keys are inert at 4:3.
[widescreen]
gte_game_mode = true
# HUD primitives are built in a static packet buffer just past the EXE image
# (census: 0x181E38..0x183B0C), while world polygons come from a pool at
# 0x1CD000+. Only packets in this range are re-anchored to the wide corners.
nw_left_hud_packet_lo = "0x00181000"
nw_left_hud_packet_hi = "0x00190000"

# Inert unless the tm2.framerate mod raises the frame-rate cap variable: a
# faster frame needs more game code per refresh than PS1 timing allows, so the
# emulated CPU is charged a quarter of its cycle cost while the cap is raised.
# The mask matches 60 (0x3C) and 30 (0x1E) but not the stock 20 / 15 caps.
[timing]
guest_cycle_scale = 4
guest_cycle_scale_gate = [
  { addr = 0x801809E8, mask = 0x18, value = 0x18 },
]

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
# (see docs/NETPLAY.md).
[netplay]
require_cue = true
required_tracks = 12
required_disc_fp = "fc12073ddaa6a53f75351e552f3543bc89e6b6c8e9327384c87178f07a01cc6e"
